name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui-interface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller "Oreimo Translator.spec" --noconfirm

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Oreimo Translator.app" "Oreimo-Translator-macOS.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Oreimo Translator/*" -DestinationPath "dist/Oreimo-Translator-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: gui-interface/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute next version (push to main)
        if: github.ref == 'refs/heads/main'
        id: nextver
        run: |
          LAST=$(git tag -l 'v*.*.*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$LAST" ]; then
            NEXT="0.1.0"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LAST"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Read tag message (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        id: tagmsg
        run: |
          MSG=$(git for-each-ref "refs/tags/${{ github.ref_name }}" --format='%(contents)')
          {
            echo "message<<TAGMSG_EOF"
            echo "$MSG"
            echo "TAGMSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f "tag_name=${{ github.ref_name }}" --jq .body)
          if [ -z "$(echo "$NOTES" | grep -E '^\* ')" ]; then
            NOTES="_No merged pull requests since the previous release._"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog (push to main)
        if: github.ref == 'refs/heads/main'
        id: changelog_main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f "tag_name=${{ steps.nextver.outputs.version }}" -f "target_commitish=main" --jq .body)
          if [ -z "$(echo "$NOTES" | grep -E '^\* ')" ]; then
            NOTES="_No merged pull requests since the previous release._"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          files: artifacts/**/*.zip
          body: |
            This release contains the **Oreimo Translator GUI** desktop tool (extraction/translation/repackaging app for Windows and macOS) — it is not the game's Spanish translation itself.

            Built and published by Choviics.

            ${{ steps.tagmsg.outputs.message }}

            ${{ steps.changelog.outputs.notes }}

      - name: Auto release (push to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.nextver.outputs.version }}
          name: ${{ steps.nextver.outputs.version }}
          target_commitish: main
          files: artifacts/**/*.zip
          body: |
            This release contains the **Oreimo Translator GUI** desktop tool (extraction/translation/repackaging app for Windows and macOS) — it is not the game's Spanish translation itself.

            Automatically published on push to main by Choviics.

            ${{ steps.changelog_main.outputs.notes }}
